name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Faellt dieser Schritt aus, sind alle weiteren Ergebnisse belanglos:
  # ein Geheimnis im Verlauf ist auch nach dem Entfernen kompromittiert.
  secrets:
    name: Geheimnisse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verlauf auf Geheimnisse pruefen
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Das Repository liefert derzeit Fachkonzepte. Ein toter Querverweis darin
  # wirkt wie ein Fehler im Code: Die Begruendung wird nicht gelesen.
  dokumente:
    name: Fachdokumente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Querverweise und ADR-Verzeichnisse pruefen
        run: python3 .github/scripts/pruefe_dokumente.py

  quality:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Beispielkonfiguration uebernehmen
        run: cp .env.example .env

      - name: Formatierung
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typen
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
