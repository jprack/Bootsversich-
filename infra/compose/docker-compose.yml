name: versicherungs-crm

# Lokale Entwicklungsumgebung.
#
# Diese Datei ist ausdruecklich NICHT fuer den Produktivbetrieb gedacht:
# die Zugangsdaten sind bekannt, die Dienste sind unverschluesselt erreichbar
# und die Daten liegen in lokalen Volumes. Siehe docs/operations/local-setup.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm-local-development
      POSTGRES_DB: crm
      # Deterministische Sortierung, damit lokale und spaetere produktive
      # Ergebnisse uebereinstimmen.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=de-AT --encoding=UTF8'
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_statement=none
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: crm-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: crm-local-access-key
      MINIO_ROOT_PASSWORD: crm-local-secret-key
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Legt den Dokumenten-Bucket an und stellt sicher, dass er NICHT oeffentlich
  # ist (docs/architecture/security-model.md §4).
  minio-init:
    image: minio/mc:latest
    container_name: crm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 crm-local-access-key crm-local-secret-key &&
      mc mb --ignore-existing local/crm-documents &&
      mc anonymous set none local/crm-documents &&
      mc version enable local/crm-documents &&
      echo 'Bucket crm-documents bereit, Zugriff privat.'
      "
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    container_name: crm-mailpit
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025/readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: crm-keycloak
    command: ['start-dev', '--import-realm', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-development
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ../keycloak/realm-crm.json:/opt/keycloak/data/import/realm-crm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q 'UP'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  clamav:
    image: clamav/clamav:stable
    container_name: crm-clamav
    ports:
      - '3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
